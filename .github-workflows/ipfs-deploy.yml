name: Build IPFS Release Artifact

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set image coordinates
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Build image
        run: bun ./scripts/build-docker.mts "$IMAGE_NAME"

      - name: Log in to GHCR
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          IMAGE_RELEASE_ID="$REGISTRY/$IMAGE_NAME:$VERSION"
          docker tag "$IMAGE_NAME" "$IMAGE_RELEASE_ID"
          docker push "$IMAGE_RELEASE_ID"
          echo "IMAGE_RELEASE_ID=$IMAGE_RELEASE_ID" >> "$GITHUB_ENV"

      - name: Build host-neutral IPFS artifact
        if: github.ref_type == 'tag'
        run: |
          mkdir -p /tmp/anonfolio-ipfs
          docker run --rm --entrypoint /bin/sh --volume /tmp/anonfolio-ipfs:/output "$IMAGE_RELEASE_ID" /export-ipfs.sh
          echo "IPFS_HASH=$(cat /tmp/anonfolio-ipfs/ipfs-cid.txt)" >> "$GITHUB_ENV"

      - name: Create release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '#### IPFS CID\n\n`%s`\n\n[ipfs://%s](ipfs://%s)\n' "$IPFS_HASH" "$IPFS_HASH" "$IPFS_HASH" > /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md \
            /tmp/anonfolio-ipfs/anonfolio.car \
            /tmp/anonfolio-ipfs/ipfs-cid.txt
